[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vishustra"
version = "0.2.0"
description = "VISHUSTRA — Where Attention Becomes Visible. An interactive Transformer research & experimentation laboratory."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
vishustra = "app.main:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"